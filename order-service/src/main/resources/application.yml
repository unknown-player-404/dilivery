server:
  port: 8082

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/takeout?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  application:
    name: order-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
        port: 8719

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

seata:
  enabled: true   # 开启服务
  application-id: ${spring.application.name}    # 服务名
  tx-service-group: delivery-tx-group     #分组名

  registry:
    # 直接读本地文件，而不是去Nacos注册中心
    type: file
    file:
      name: default

  service:
    grouplist:
      default: 127.0.0.1:8091   # Seata服务端地址
    vgroup-mapping:
      delivery-tx-group: default  #映射到default集群